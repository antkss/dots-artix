[colors]
draw_bold_text_with_bright_colors = false 
[env]
TERM = "alacritty"

[font]
size = 13

[font.normal]
family = "Jetbrains Mono Nerd Font"
style = "bold"
[font.bold]
family = "victor mono"
style = "bold italic"
[font.italic]
family = "victor mono"	
style = "italic"
[font.bold_italic]
family = "victor mono"	
style = "bold italic"
[selection]
save_to_clipboard = false

[window]
# dynamic_padding = true
# dynamic_title = true
opacity = 0.9

[window.dimensions]
columns = 100
lines = 30

[window.padding]
x = 0
y = 0
[cursor]
# Set to false to disable completely
# smooth_motion = false
# # 0.0 = cursor is not moving, 1.0 = cursor moves instantly
# smooth_motion_factor = 0.2
# # 0.0 = broken, 1.0 = cursor shape is unaffected by movement
# smooth_motion_spring = 1.0
# # Limits how the cursor size may change
# smooth_motion_max_stretch_x = 1.1
# smooth_motion_max_stretch_y = 1.1
# # Override "block" cursor if you don't like how it looks in this fork
# # I prefer "underline"
# block_replace_shape = "block"

[cursor.style]
blinking = "off"
shape = "block"

[general]
live_config_reload =false
import = ["~/.config/alacritty/color.toml"]
# shader = "shaders/smearfire.glsl"
shader = "shaders/fire.glsl"
animated = false
shader_duration = 1.0
vframe_fps = 90
# shader = "shaders/freeze.glsl"
# shader = "shaders/shakefire.glsl"
# shader = "shaders/water.glsl"
# [features]
# default = ["wayland"]
[keyboard]
bindings = [
{ key = "Enter", mods = "Shift", action = "CreateNewWindow" },
{ key = "L", mods = "Control|Shift", chars = "l" },
{ key = "F8", chars = "ni\n" },
{ key = "F9", chars = "c\n" },
{ key = "F7", chars = "si\n" },
{ key = "F7", mods = "Control", chars = "nextr\n" },
]
[mouse]
bindings = [
	{ mouse = "Right", chars = "ni\n" },
	{ mouse = "Middle", chars = "si\n" },
	{ mouse = "Back", chars = "c\n"},
]
# [scrollbar]
# mode = "Fading"


   


